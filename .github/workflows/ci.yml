name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Record Flutter and Dart versions
        run: flutter --version

      - name: Prepare the library
        run: flutter pub get

      - name: Prepare the catalog
        working-directory: widgetbook
        run: flutter pub get --enforce-lockfile

      - name: Check generated catalog entries
        working-directory: widgetbook
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/main.directories.g.dart

      - name: Analyze both packages
        run: flutter analyze --no-pub

      - name: Test the library
        run: flutter test --no-pub

      - name: Build the web catalog
        working-directory: widgetbook
        run: flutter build web --release --no-pub --no-web-resources-cdn

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog
          path: widgetbook/build/web/
          retention-days: 7

  deploy:
    name: Deploy catalog
    needs: check
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog
          path: widgetbook/build/web

      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            npx --yes wrangler@4.149.0 deploy
          else
            url="$(npx --yes wrangler@4.149.0 preview --name "pr-$PR_NUMBER" --json | jq -er '.preview.urls[0]')"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Catalog preview: $URL"
