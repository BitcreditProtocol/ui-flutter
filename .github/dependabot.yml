version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /widgetbook
    groups:
      dart:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Vienna
    open-pull-requests-limit: 7
    labels:
      - dependencies
      - dart
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    assignees:
      - JulianVIE

  - package-ecosystem: github-actions
    directory: /
    groups:
      all-github-actions:
        patterns:
          - "*"
    schedule:
      interval: monthly
      time: "08:30"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    cooldown:
      default-days: 3
    assignees:
      - JulianVIE
